<svg xmlns="http://www.w3.org/2000/svg" width="800" height="110" viewBox="0 0 800 110" role="img" aria-label="Hi, creator — Vanesa Paco">
  <title>Header · vanesapaco</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8639b0"/><stop offset="1" stop-color="#b57edc"/></linearGradient>
    <clipPath id="c"><rect x="0" y="20" width="800" height="60"><animate attributeName="width" values="0;800;800;0" keyTimes="0;.45;.9;1" dur="3.0s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <style>
    text { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace; }
    .t { fill:url(#g); font-size:30px; font-weight:700; opacity:0; }
    .sub { fill:#8b7a99; font-size:12px; letter-spacing:3px; }
    .star { fill:#b57edc; animation:tw 2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    @keyframes tw { 0%,100% { opacity:.25; transform:scale(.7); } 50% { opacity:1; transform:scale(1.15); } }
        @keyframes s0 { 0%,0.00% { opacity:0; } 1.00%,31.33% { opacity:1; } 32.33%,100% { opacity:0; } }
    .t0 { animation:s0 9.0s linear infinite; }
    @keyframes s1 { 0%,33.33% { opacity:0; } 34.33%,64.67% { opacity:1; } 65.67%,100% { opacity:0; } }
    .t1 { animation:s1 9.0s linear infinite; }
    @keyframes s2 { 0%,66.67% { opacity:0; } 67.67%,98.00% { opacity:1; } 99.00%,100% { opacity:0; } }
    .t2 { animation:s2 9.0s linear infinite; }
  </style>
  <rect width="800" height="110" rx="14" fill="#0f0a14"/>
  <text x="60" y="40" class="star" font-size="18">✦</text>
  <text x="730" y="80" class="star" font-size="14" style="animation-delay:.8s">✦</text>
  <text x="120" y="90" class="star" font-size="10" style="animation-delay:1.4s">✦</text>
  <g clip-path="url(#c)"><text x="400" y="62" text-anchor="middle" class="t t0">Hi, creator ✦</text><text x="400" y="62" text-anchor="middle" class="t t1">Content Marketer &amp; Writer</text><text x="400" y="62" text-anchor="middle" class="t t2">Tecnología + Marketing + IA</text></g>
  <text x="400" y="96" text-anchor="middle" class="sub">VANESA PACO · @VANESAPACO</text>
