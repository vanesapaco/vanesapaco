  <style>
    text { font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif; }
    .lbl { fill:#b31b2c; font-size:12px; font-weight:700; letter-spacing:2.5px; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace; }
    .spk { fill:#b31b2c; animation:tw 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    @keyframes tw { 0%,100% { opacity:.35; transform:scale(.6) rotate(0deg); } 50% { opacity:1; transform:scale(1) rotate(45deg); } }

    .bd { opacity:0; animation:pop .6s cubic-bezier(.2,1.4,.4,1) forwards; transform-box:fill-box; transform-origin:center; }
    .org { fill:#b31b2c; font-size:15px; font-weight:800; }
    .sub { fill:#8a7b78; font-size:10.5px; font-weight:600; }
    .nm { fill:#2b1a1c; font-size:13px; font-weight:700; }
    .sh { stroke-dasharray:252; stroke-dashoffset:252; animation:draw 3s ease-in-out infinite; }
    @keyframes pop { from { opacity:0; transform:scale(.6); } to { opacity:1; transform:scale(1); } }
    @keyframes draw { 0% { stroke-dashoffset:252; } 50% { stroke-dashoffset:0; } 100% { stroke-dashoffset:-252; } }
  </style>
